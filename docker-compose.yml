services:
  backend:
    build: ./backend/backend
    container_name: nextstep-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8001
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - ai-service

  ai-service:
    build: ./ai-service
    container_name: nextstep-ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env